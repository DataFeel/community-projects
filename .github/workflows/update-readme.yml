name: Update project list

on:
  # Rebuild every Monday at 14:00 UTC to pick up newly tagged repos and broken links.
  schedule:
    - cron: "0 14 * * 1"
  # Rebuild whenever the curated list or the generator changes.
  push:
    branches: [main]
    paths:
      - projects.yml
      - scripts/build_readme.py
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml==6.0.2

      - name: Rebuild README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_readme.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update project list"
          git push
