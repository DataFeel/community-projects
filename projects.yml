# DataFeel Community Projects
# Source of truth for the README. Edit, commit, and the README rebuilds.
# Field notes: see CONTRIBUTING.md.

settings:
  topic: datafeel
  exclude_owners:
    - DataFeel
  exclude_repos: []

projects:
  - name: FireDrill AR
    repo: prakhar2000/FIreDrillAR
    event: LA Tech Week MOLTEN Spatial Hackathon 2026
    track: Worldbuild
    description: >-
      Turns any real room into a mixed-reality fire drill, with spreading fire,
      banking smoke, exit signs, and an AI voice coach. DataFeel Dots on both wrists
      warm on the side the fire is on, buzz in the smoke, and cool at the safe exit.
    demo: https://firedrill-ar.vercel.app
    team:
      - name: Prakhar
        github: prakhar2000
      - name: Varnika
      - name: Eileen
      - name: Devaj
      - name: Emma

  - name: Blind Samurai
    repo: MarkymarkLee/BlindSamurai
    event: SF Tech Week INTERFACE hackathon 2026
    description: >-
      A sword-fighting game built for blind and low-vision players, where unseen
      monsters are tracked through 3D audio and touch. Four DataFeel Dots on the ribs,
      chest, and wrist buzz toward the enemy and heat up as it closes in.
    featured: true
    team:
      - name: MarkymarkLee
        github: MarkymarkLee

  - name: Resonance
    repo: KaushikSiva/resonance
    event: SF Tech Week INTERFACE hackathon 2026
    description: >-
      Turns a music video into a full-body experience. A DataFeel Dot on the wrist
      warms and pulses to the beat, a 60 GHz radar lets you conduct the intensity
      with your hand, and a robot dances along.
    demo: https://youtu.be/7JQqd8YsqEc
    team:
      - name: KaushikSiva
        github: KaushikSiva

  - name: Haptic Ride
    repo: raymondymmak/haptic-ride
    event: SF Tech Week INTERFACE hackathon 2026
    track: Touch
    description: >-
      Feel cars behind you and turn cues on your wrists while biking.
    featured: true
    team:
      - name: Raymond Mak
        github: raymondymmak
        linkedin: https://www.linkedin.com/in/raymondymmak/
